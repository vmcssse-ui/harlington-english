<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not For Me · British Poetry · Year 7 English</title>
<meta name="description" content="Jess thinks poems are not for her. Then she starts to listen to the world around her.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  /* Page B wears forest — a warm, high-contrast READING accent. The text is never
     withheld here, so nothing in the palette says "ears first". */
  --ac:#1F6F5F; --ac-soft:#DDEDE8; --ac-deep:#163F38; --ac-ink:#A6D9CB; --ac-sub:#CDE8DF;
  --hl-s:#E6F2EE;            /* current sentence */
  --hl-w:#F6C453;            /* current word — warm amber on ink */
  --amber:#B97F1E; --amber-bg:#F6E3BC; --amber-solid:#E8A33D;
  --violet:#6B5B95; --violet-bg:#E8E4F1;
  --teal:#25706B;   --teal-bg:#D9EBEA;
  --coral:#C94F3D;  --coral-bg:#F6E1DD;
  --navy:#1F3557;   --navy-bg:#DDE4EE; --soft:#F2F4F7;
  --good:#2E7D4F;   --good-bg:#DCEFE3;
  --warn:#1F6F5F;   --warn-bg:#EEF6F3;
  --ink:#232F3D; --head:#0F2740; --muted:#5C6874;
  --paper:#FBFAF6; --page:#FFFFFF; --rule:#D9DFE6; --box:#FBFCFD; --quote:#F4F6F8;
  --desk1:#EEF4F1; --desk2:#E0ECE7;
  --ui:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --read:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --wrap:clamp(600px,74vw,1000px);
  --fs:clamp(16px,.30vw + 14.8px,19px);
  --fs-sm:clamp(13.5px,.22vw + 12.6px,15.5px);
  --fs-lg:clamp(16.5px,.42vw + 14.8px,20.5px);
  --pad-card:clamp(15px,1.2vw,24px);
  --tap:44px;
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
     font-size:var(--fs);line-height:1.6;-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:4px}
button{touch-action:manipulation}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 clamp(18px,4vw,36px)}
.howto p,.mbody>p,.mbody>ul{max-width:70ch}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- chapter head ---------- */
.chead{background:var(--ac-deep);color:#fff;padding:clamp(30px,6vw,52px) 0 clamp(24px,4vw,34px);margin-bottom:clamp(24px,4vw,38px)}
.eyebrow{font-size:clamp(12.5px,.5vw + 11px,15px);font-weight:700;letter-spacing:.15em;text-transform:uppercase;
         color:var(--ac-ink);margin:0 0 12px}
.chead h1{font-size:clamp(30px,4.6vw,58px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 10px}
.chead .sub{margin:0 0 22px;color:var(--ac-sub);font-size:var(--fs-lg);max-width:64ch}
.rail{display:flex;gap:5px;margin:0 0 8px}
.rail i{flex:1;height:clamp(5px,.42vw,8px);border-radius:3px;background:rgba(255,255,255,.22)}
.rail i.on{background:var(--hl-w)}
.railtext{margin:0;font-size:var(--fs-sm);color:var(--ac-ink);font-weight:700;letter-spacing:.04em}

/* ---------- review banner (teacher tool) ---------- */
.review[hidden]{display:none}
.review{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
        border:1px dashed var(--ac);background:var(--warn-bg);border-radius:10px;
        padding:clamp(13px,1.2vw,20px) clamp(15px,1.4vw,24px);margin:0 0 22px}
.rvtext{flex:1 1 260px;min-width:0}
.rvtext b{display:block;font-size:var(--fs);font-weight:800;color:var(--head)}
.rvtext span{display:block;font-size:var(--fs-sm);color:var(--muted);margin-top:3px;line-height:1.45}
.rvbtns{display:flex;gap:9px;flex-wrap:wrap}
.review button{font:inherit;font-size:var(--fs-sm);font-weight:700;cursor:pointer;background:#fff;min-height:var(--tap);
               border:1.5px solid var(--head);color:var(--head);border-radius:7px;padding:9px 15px}
.review button:hover{background:var(--head);color:#fff}
#rvreset{border-color:var(--rule);color:var(--muted)}

/* ---------- the desk ---------- */
.desk{margin:0 0 34px;padding:clamp(24px,3.4vw,52px) clamp(18px,3vw,46px);border-radius:14px;
      background:linear-gradient(170deg,var(--desk1),var(--desk2));border:1px solid var(--rule);
      display:flex;gap:clamp(20px,4vw,34px);align-items:center;flex-wrap:wrap}
.deskcopy{flex:1 1 240px;min-width:0}
.deskcopy h2{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
             color:var(--muted);margin:0 0 10px}
.deskcopy p{margin:0 0 16px;font-size:var(--fs);color:#3A4756;max-width:46ch}
.deskcopy .rungs{list-style:none;padding:0;margin:0 0 18px;font-size:var(--fs-sm)}
.deskcopy .rungs li{display:flex;gap:9px;align-items:center;padding:0;color:var(--muted)}
.deskcopy .rungs button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;font:inherit;
                        background:none;border:0;padding:6px 0;min-height:var(--tap);cursor:pointer;color:inherit;border-radius:6px}
.deskcopy .rungs b{flex:none;width:clamp(22px,1.5vw,26px);height:clamp(22px,1.5vw,26px);border-radius:50%;
                   background:var(--rule);color:#fff;font-size:11px;display:grid;place-items:center}
.deskcopy .rungs li.on b{background:var(--ac)}
.deskcopy .rungs li.on{color:var(--head);font-weight:700}
.deskcopy .rungs li.ok b{background:var(--good);font-size:0}
.deskcopy .rungs li.ok b::after{content:"✓";font-size:12px}
.bookobj{flex:0 0 auto;width:clamp(150px,19vw,264px);border:0;padding:0;background:none;cursor:pointer;perspective:900px}
.bookobj .slab{position:relative;aspect-ratio:3/4;border-radius:3px 9px 9px 3px;
      background:linear-gradient(115deg,#174F45,#237A69 58%,#1B5C4F);
      box-shadow:0 18px 34px rgba(20,45,40,.34),0 3px 8px rgba(20,45,40,.24);
      transform:rotateY(-13deg) rotateX(3deg);transform-origin:left center;
      transition:transform .3s cubic-bezier(.3,.1,.2,1),box-shadow .3s;
      display:flex;flex-direction:column;justify-content:space-between;
      padding:clamp(14px,3vw,20px) clamp(12px,2.6vw,17px) clamp(14px,3vw,20px) clamp(18px,3.4vw,24px);
      overflow:hidden;text-align:left}
.bookobj:hover .slab,.bookobj:focus-visible .slab{transform:rotateY(-7deg) rotateX(2deg) translateY(-4px)}
.bookobj .slab::before{content:"";position:absolute;left:0;top:0;bottom:0;width:11px;
      background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(255,255,255,.10) 62%,rgba(0,0,0,.16))}
.bookobj .slab::after{content:"";position:absolute;right:0;top:5px;bottom:5px;width:6px;border-radius:0 3px 3px 0;
      background:repeating-linear-gradient(90deg,#FBFAF6 0 1px,#D9DDE2 1px 2px)}
.bookobj .bk{font-size:clamp(9.5px,.62vw,12.5px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;
             color:var(--hl-w);margin:0}
.bookobj .bt{font-size:clamp(15px,2.0vw,24px);font-weight:800;line-height:1.15;color:#fff;
             letter-spacing:-.01em;margin:8px 0 0}
.bookobj .bm{font-size:clamp(10px,.62vw,13px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
             color:var(--ac-ink);margin:0}
.bookobj .open{display:block;margin-top:14px;font-size:var(--fs-sm);font-weight:800;color:var(--ac);text-align:center}
.earsband{flex:0 0 100%;display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--ac-soft);
          border-radius:9px;padding:clamp(12px,1vw,18px) clamp(14px,1.2vw,22px)}
.earsband span{font-size:26px}
.earsband p{margin:0;font-size:var(--fs-sm);color:var(--muted);max-width:none}
.earsband b{color:var(--ac)}

/* ---------- module stack ---------- */
.howto{background:var(--box);border:1px solid var(--rule);border-radius:10px;
       padding:clamp(18px,3.5vw,26px);margin:0 0 28px}
.howto h2{font-size:clamp(14px,.5vw + 12.6px,17px);font-weight:800;letter-spacing:.1em;text-transform:uppercase;
          color:var(--muted);margin:0 0 12px}
.howto p{margin:0 0 12px}
.howto p:last-child{margin:0}
.mod{border:1px solid var(--rule);border-left:5px solid var(--c);border-radius:9px;
     background:#fff;margin:0 0 12px;overflow:hidden}
.mhead{display:flex;gap:clamp(13px,1vw,20px);align-items:flex-start;width:100%;text-align:left;
       background:none;border:0;cursor:pointer;padding:var(--pad-card);font:inherit;color:var(--head);min-height:var(--tap)}
.mhead:hover{background:var(--box)}
.mnum{flex:none;width:clamp(27px,2.1vw,36px);height:clamp(27px,2.1vw,36px);border-radius:50%;
      background:var(--c);color:#fff;display:grid;place-items:center;
      font-size:clamp(13px,.85vw,16px);font-weight:800}
.mod.done .mnum{background:var(--good);font-size:0}
.mod.done .mnum::after{content:"✓";font-size:clamp(14px,.95vw,18px)}
.mtitle{flex:1;min-width:0}
.mtitle b{display:block;font-size:var(--fs-lg);line-height:1.3}
.mtitle span{display:block;font-size:var(--fs-sm);color:var(--muted);margin-top:3px}
.chev{flex:none;color:var(--muted);transition:transform .2s}
.mod.book .mhead .chev,.mod.leaf-mod .mhead .chev{transform:none;font-size:var(--fs-sm);font-weight:800;color:var(--ac)}
.stackhd{font-size:var(--fs-lg);font-weight:800;color:var(--head);margin:30px 0 8px;padding-top:18px;border-top:2px solid var(--rule)}
.stackhd:first-of-type{margin-top:0;padding-top:0;border-top:0}
.stacksub{margin:0 0 16px;color:var(--muted);font-size:var(--fs);max-width:66ch}
.btn{font:inherit;font-weight:700;font-size:var(--fs);cursor:pointer;border:0;border-radius:7px;min-height:var(--tap);
     background:var(--head);color:#fff;padding:clamp(11px,.9vw,15px) clamp(20px,1.6vw,28px)}
.btn.ghost{background:none;color:var(--head);border:1.5px solid var(--head)}
.note{font-size:var(--fs-sm);color:var(--muted);border-left:3px solid var(--ac-soft);padding-left:12px;margin:14px 0 0}
footer{padding:34px 0 60px;font-size:13px;color:var(--muted);line-height:1.7}

/* grammar table (gap modules may pin one in the text pane) */
.gtab{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:var(--fs)}
.gtab caption{text-align:left;font-size:clamp(11.5px,.58vw,13.5px);font-weight:800;letter-spacing:.12em;
              text-transform:uppercase;color:var(--teal);padding:0 0 9px}
.gtab th,.gtab td{border:1px solid var(--rule);padding:clamp(8px,.7vw,13px) clamp(9px,.8vw,15px);text-align:left}
.gtab th{background:var(--teal-bg);color:var(--teal);font-weight:800;font-size:var(--fs-sm)}
.gtab td b{color:var(--teal)}
.gtab.mini th,.gtab.mini td{padding:6px 8px}
.gwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ================= THE BOOK ================= */
.bookwrap{position:fixed;inset:0;z-index:80;display:none;place-items:center;
          padding:clamp(10px,2.4vw,30px);background:rgba(18,38,34,.62);
          backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.bookwrap.on{display:grid;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.open-book{position:relative;width:100%;max-width:clamp(900px,94vw,1560px);height:min(93vh,980px);
     display:flex;flex-direction:column;background:var(--page);border-radius:4px 12px 12px 4px;
     box-shadow:0 30px 70px rgba(10,28,24,.50);animation:lift .26s cubic-bezier(.3,.1,.2,1);overflow:hidden}
@keyframes lift{from{transform:translateY(16px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.open-book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:13px;z-index:3;pointer-events:none;
     border-radius:4px 0 0 4px;background:linear-gradient(90deg,#143F37,#237A69 46%,#174C42)}
.open-book.spread::before{width:7px;top:8px;bottom:8px;
     background:repeating-linear-gradient(90deg,#DEE3E9 0 1px,#FFFFFF 1px 2px)}
.open-book::after{content:"";position:absolute;right:0;top:8px;bottom:8px;width:7px;z-index:3;pointer-events:none;
     border-radius:0 4px 4px 0;background:repeating-linear-gradient(90deg,#FFFFFF 0 1px,#DEE3E9 1px 2px)}
.bookbar{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
         padding:clamp(12px,.9vw,18px) clamp(22px,1.8vw,34px) clamp(12px,.9vw,18px) clamp(30px,2.2vw,42px);
         border-bottom:1px solid var(--rule);background:linear-gradient(#FFF,#FAFBFC)}
.bookbar .bt{flex:1;min-width:0;font-size:clamp(12.5px,.62vw,15px);font-weight:800;letter-spacing:.12em;
             text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookbar .ptag{flex:none;font-size:clamp(11px,.58vw,13.5px);font-weight:800;letter-spacing:.12em;
               text-transform:uppercase;color:#fff;background:var(--ac);padding:6px 14px;border-radius:20px}
.bookbar button{font:inherit;background:none;border:0;cursor:pointer;color:var(--head);min-height:var(--tap);
                font-size:var(--fs-sm);font-weight:700;padding:7px 12px;border-radius:6px}
.bookbar button:hover{background:var(--quote)}
/* The player is pinned OUTSIDE the paginated flow: controls inside CSS multicol + a
   transform are unreliable, and pinning keeps the voice going while pages turn. */
.pbar{flex:none;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;
      padding:clamp(10px,.8vw,16px) clamp(22px,1.8vw,34px) clamp(10px,.8vw,16px) clamp(30px,2.2vw,42px);
      border-bottom:1px solid var(--ac-soft);background:var(--warn-bg)}
.pbtn{font:inherit;font-weight:800;font-size:var(--fs);cursor:pointer;border:0;border-radius:24px;
      min-height:var(--tap);min-width:var(--tap);background:var(--ac);color:#fff;padding:9px 22px;display:inline-flex;gap:8px;align-items:center}
.pbtn.ghost{background:#fff;color:var(--ac);border:2px solid var(--ac)}
.pbtn[disabled]{opacity:.4;cursor:default}
.speed{display:inline-flex;border:2px solid var(--ac);border-radius:24px;overflow:hidden;background:#fff}
.speed button{font:inherit;font-size:var(--fs-sm);font-weight:800;cursor:pointer;border:0;background:none;
              color:var(--ac);min-height:var(--tap);padding:0 16px}
.speed button[aria-pressed="true"]{background:var(--ac);color:#fff}
.speed button+button{border-left:2px solid var(--ac)}
.playing-now{flex:1 1 200px;min-width:0;font-size:var(--fs-sm);color:var(--muted);font-weight:700}
.playing-now b{color:var(--ac)}
.viewport{flex:1;position:relative;overflow:hidden;overflow:clip;touch-action:pan-y;cursor:grab;background:var(--page)}
.viewport.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.viewport.dragging *{cursor:grabbing}
.gutter{position:absolute;top:0;bottom:0;left:var(--gut,50%);width:2px;
        background:linear-gradient(90deg,rgba(28,50,45,.16),rgba(28,50,45,.22),rgba(28,50,45,.16));
        z-index:2;pointer-events:none;display:none}
.viewport.spread .gutter{display:block}
.gutter::before,.gutter::after{content:"";position:absolute;top:0;bottom:0;width:34px}
.gutter::before{right:2px;background:linear-gradient(90deg,rgba(28,50,45,0),rgba(28,50,45,.11))}
.gutter::after{left:2px;background:linear-gradient(90deg,rgba(28,50,45,.11),rgba(28,50,45,0))}
.flow{position:absolute;top:0;bottom:0;left:0;font-family:var(--read);
      font-size:clamp(19px,.55vw + 16.5px,26px);line-height:1.75;color:#1a2733;
      padding:clamp(22px,2.6vw,52px) clamp(24px,2.6vw,54px);
      column-fill:auto;transition:transform .3s cubic-bezier(.4,.1,.2,1)}
.flow p,.flow h1,.flow h2,.lo-num,.endnote{break-inside:avoid}
.bpage+.bpage{break-before:column}
.bookfoot{flex:none;display:flex;align-items:center;gap:12px;
          padding:clamp(9px,.7vw,15px) clamp(22px,1.8vw,34px) clamp(9px,.7vw,15px) clamp(30px,2.2vw,42px);
          border-top:1px solid var(--rule);background:linear-gradient(#FAFBFC,#FFF);
          font-size:var(--fs-sm);color:var(--muted)}
.bookfoot button{font:inherit;background:#fff;border:1px solid var(--rule);border-radius:7px;min-height:var(--tap);min-width:var(--tap);
                 cursor:pointer;color:var(--head);padding:clamp(7px,.6vw,11px) clamp(15px,1.3vw,22px);font-weight:700}
.bookfoot button[disabled]{opacity:.3;cursor:default}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:clamp(6px,.45vw,9px);height:clamp(6px,.45vw,9px);border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--ac)}

/* book typography */
.lo-num{display:inline-block;font-family:var(--ui);font-size:clamp(11.5px,.6vw,14px);font-weight:800;
        letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--ac);
        padding:6px 15px;border-radius:20px;margin:0 0 14px}
.flow h1{font-family:var(--ui);font-size:clamp(23px,2.1vw,40px);font-weight:800;letter-spacing:-.018em;
         line-height:1.15;color:var(--head);margin:0 0 8px}
.flow .why{font-family:var(--ui);font-size:clamp(14.5px,.42vw + 12.9px,18px);color:var(--muted);
           margin:0 0 22px;line-height:1.5}
.flow h2.ph{font-family:var(--ui);font-size:clamp(12px,.62vw,15px);font-weight:800;letter-spacing:.14em;
            text-transform:uppercase;color:var(--ac);margin:0 0 12px}
.bpage{margin:0 0 26px}
.story{margin:0}
/* sentences and words — the highlight units */
.s{cursor:pointer;border-radius:6px;padding:2px 0;transition:background .15s;-webkit-tap-highlight-color:transparent}
.s:hover{background:var(--quote)}
.s:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.s.cur-s{background:var(--hl-s);box-shadow:0 0 0 4px var(--hl-s)}
.w{border-radius:4px;padding:0 1px;transition:background .08s}
.w.cur-w{background:var(--hl-w);color:#1a1a1a;box-shadow:0 0 0 3px var(--hl-w)}
.w.gl{cursor:pointer}
.w.gl .glu{text-decoration:underline dotted var(--ac) 2px;text-underline-offset:4px}
.w.gl:hover{background:var(--ac-soft)}
.endnote{border:1px solid var(--rule);background:var(--box);border-radius:8px;padding:15px 17px;margin:22px 0 0;font-family:var(--ui)}
.endnote b{font-size:clamp(11.5px,.6vw,14px);font-weight:800;letter-spacing:.12em;
           text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px}
.endnote p{font-size:clamp(14.5px,.4vw + 13px,18px);margin:0 0 12px;color:var(--muted);line-height:1.5}
.endnote .btn{font-size:var(--fs-sm)}
.passnote{display:none;flex:0 0 100%;gap:10px;align-items:center;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--head);font-weight:700}
.passnote.on{display:flex}
.passnote .btn{font-size:var(--fs-sm);background:var(--ac);padding:8px 16px;min-height:40px}

/* the glossary sheet — global so it serves the book and the leaf */
.sheet{position:fixed;inset:0;z-index:95;display:flex;align-items:flex-end;
       background:rgba(18,38,34,.30);animation:fadein .18s ease}
.sheet[hidden]{display:none}
.sheetin{width:100%;max-width:720px;margin:0 auto;max-height:84%;overflow-y:auto;background:var(--warn-bg);
         border-top:3px solid var(--warn);border-radius:14px 14px 0 0;
         padding:16px clamp(22px,3.4vw,40px) 24px;box-shadow:0 -10px 30px rgba(18,38,34,.16);
         animation:rise .24s cubic-bezier(.4,.1,.2,1)}
@keyframes rise{from{transform:translateY(22px)}to{transform:none}}
.sheethd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
.sheethd b{font-size:clamp(11.5px,.6vw,14px);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--warn)}
.sheethd button{font:inherit;font-size:var(--fs-sm);font-weight:700;cursor:pointer;background:#fff;min-height:var(--tap);
                border:1.5px solid var(--warn);color:var(--warn);border-radius:7px;padding:7px 15px}
.gword{font-size:clamp(26px,2.4vw,38px);font-weight:800;color:var(--head);margin:0 0 2px;line-height:1.2}

d","rhymes with","from the story"],["rain","again","skip in the rain … back again"],["tap","nap","tap, tap, tap … come for a nap"],["low","below","small and low … the road below"],["cat","that","a poem line you could write: I like that cat"],["sun","fun","not in the story — can you use it?"]]},"items":[{"before":"Skip in the sun, skip in the rain, skip to the shop and back","after":"!","options":["again","home","now"],"answer":0,"why":"Rain and again rhyme: skip to the shop and back again!"},{"before":"Rain on the roof goes tap, tap, tap. The fog is a cat that has come for a","after":".","options":["sleep","nap","rest"],"answer":1,"why":"Tap and nap rhyme: the fog is a cat that has come for a nap."},{"before":"The lamp is a moon, small and low. The bus is a boat on the road","after":".","options":["outside","tonight","below"],"answer":2,"why":"Low and below rhyme: the bus is a boat on the road below."},{"before":"The fog is a cat. I like","after":".","options":["that","it","this"],"answer":0,"why":"Cat and that rhyme: The fog is a cat. I like that."},{"before":"Jess sat at the back. She looked at her","after":".","options":["phone","pack","book"],"answer":1,"why":"Back and pack rhyme: she looked at her pack."},{"before":"The class was quiet. Then they clapped. Jess felt warm, like a cat that is","after":".","options":["asleep","happy","wrapped"],"answer":2,"why":"Clapped and wrapped rhyme: like a cat that is wrapped."},{"before":"The beat of the rain, the beat of the","after":".","options":["train","bus","song"],"answer":0,"why":"Rain and train rhyme: the beat of the rain, the beat of the train."},{"before":"Leo can skip in the sun. Leo can skip just for","after":".","options":["ever","fun","joy"],"answer":1,"why":"Sun and fun rhyme: Leo can skip just for fun."}]},{"key":"speaking","kind":"say","title":"Speaking — say it like a poet","colour":"coral","lead":"Hear the line, then say it. Record yourself if you like — nobody marks it.","items":[{"line":"Poems are not for me.","tip":"Say it with a big sigh, like Jess at the start."},{"line":"Tap, tap, tap-tap, tap.","tip":"Tap the beat on the desk as you say it."},{"line":"Skip in the sun, skip in the rain, skip to the shop and back again!","tip":"Say it fast and bouncy, like a skipping chant."},{"line":"That is a rhyme!","tip":"Say it like you have just found something."},{"line":"The fog is a cat that has come for a nap.","tip":"Say it slowly and softly, like a cat."},{"line":"The bus is a boat on the road below.","tip":"Say it low and steady, like a boat rocking."},{"line":"It is LIKE a cat. Soft and grey and slow.","tip":"Make the word LIKE the loudest word."},{"line":"Poems are for me.","tip":"Say it proudly, like Jess at the end."}]},{"key":"writing","kind":"frame","title":"Writing — finish the sentence","colour":"navy","lead":"Finish each sentence. Any answer in your own words counts.","items":[{"frame":"At the start, Jess thought poems were","model":"At the start, Jess thought poems were just words that did not make sense."},{"frame":"The rain on the bus roof had a rhythm because","model":"The rain on the bus roof had a rhythm because it went tap, tap, tap-tap, tap like a drum."},{"frame":"Rain and again are a rhyme because","model":"Rain and again are a rhyme because they end with the same sound."},{"frame":"The fog was like a cat because","model":"The fog was like a cat because it was soft and grey and slow."},{"frame":"A song is like a poem because","model":"A song is like a poem because it has a beat, rhymes and verses."},{"frame":"A simile is","model":"A simile is when you say one thing is LIKE another thing."},{"frame":"Jess's voice shook at first, but then","model":"Jess's voice shook at first, but then she found the beat and it got easy."},{"frame":"I think poems are for me because","model":"I think poems are for me because sounds, beats and pictures are all around me too."}]},{"key":"retell","kind":"retell","title":"Retell it in eight pictures","colour":"amber","l <script>
(function(){
"use strict";

/* =============== manifest, labels, state =============== */
var M = JSON.parse(document.getElementById("manifest").textContent);
var DEFAULT_LABELS = {
  deskTitle:"This chapter's book",
  deskIntro:"The whole story is here from the start. Press play and the words light up as they are read. Read it three ways, in any order.",
  openBook:"Open the book ›",
  bandText:"<b>Nothing is hidden.</b> The words are always on the page. Listen first if you like, read along when you are ready, and tap any sentence to hear it again.",
  howtoTitle:"How this chapter works",
  howto:["You will meet the same story <b>three times</b>: listen and watch the words, read along with the voice, then read it yourself. Every pass is open from the start.",
         "Then come the modules: words, order, reading, grammar, speaking and writing, each with the story beside it. Get one wrong and help appears straight away — then you try again. Nothing is ever locked."],
  passesHead:"The book — three passes", passesSub:"Do them in order if you can. Each one ticks when you reach the end.",
  modulesHead:"The modules", modulesSub:"Six to eight short tasks each, with the story on the left. Tap a sentence to hear it.",
  passTag:"Pass", moduleTag:"Module", railText:"{n} of {m} done",
  openTheBook:"open the book ›", openTheLeaf:"open the leaf ›",
  play:"Play", pause:"Pause", restart:"Start again", slow:"Slow", medium:"Medium", normal:"Normal",
  closeBook:"Close the book ✕", close:"Close ✕", theStory:"The story", theTasks:"The tasks", openBookShort:"Open the book",
  check:"Check", finish:"Finish the module", finishPass:"I finished this pass ✓",

  endTitle:"The end of the story", endText:"When you have reached here, tick the pass.",
  hearIt:"Hear it", tapHint:"Tap any sentence to hear it. Dotted words open a meaning.",
  wordHelp:"Word help", whatMeans:"What does it mean?",
  record:"Record me", stopRec:"Stop", saidIt:"I said it ✓", noMic:"No microphone here — just say it aloud.",
  showModel:"Show a model", modelLabel:"One way to write it", write:"Write here…",
  right:"That's right!", helpLabel:"Some help", tryAgain:"Have another go.",
  orderHint:"Tap the events in the order they happen in the story.", yourOrder:"Your order", undo:"Undo last", orderRight:"That's the order!",
  orderWhy:"The story goes like this:",
  answered:"{n} of {m} answered", allDone:"All done — you can finish the module.", notYet:"{n} left to do.",

  reset:"Reset progress",

  nowPlaying:"Reading…", nowPaused:"Paused", nowReady:"Ready", nowSilent:"No voice on this device — watch the words",
  footer:"Progress is saved only in this browser.",
  modelRetell:"One way to tell it", of:"of"
};
var L = Object.assign({}, DEFAULT_LABELS, M.labels||{});
function lbl(k,vars){ var s=L[k]||""; Object.keys(vars||{}).forEach(function(v){ s=s.split("{"+v+"}").join(vars[v]); }); return s; }
var QS = new URLSearchParams(location.search);
var TEACHER = QS.get("teacher")==="1";
var KEY = M.meta.id+":chapter";
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
var PASSES = M.passes||[], MODS = M.modules||[], PAGES = M.reading.pages||[], GLOSS = M.reading.glossary||[];
var SPEEDS=[0.7,0.85,1.0], SPEEDL=["slow","medium","normal"];
var COLOURS={amber:"var(--amber-solid)",violet:"var(--violet)",navy:"var(--navy)",teal:"var(--teal)",coral:"var(--coral)",ac:"var(--ac)",forest:"var(--ac)"};
var KINDLBL={words:"words",order:"listening",find:"reading",gap:"grammar",say:"speaking",frame:"writing",retell:"retell"};

var state = {passes:{}, modules:{}, speed:0.85};
try{ var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw); if(o&&typeof o==="object") state=Object.assign(state,o); } }catch(e){}
if(SPEEDS.indexOf(state.speed)<0) state.speed=0.85;
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
function el(i){ return document.getElementById(i); }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }

/* =============== sentences and words =============== */
/* One manifest sentence = one highlight unit. Words are split on whitespace; a word
   keeps its punctuation for display but is compared bare for the glossary. */
var GLOSSMAP={}; GLOSS.forEach(function(g,i){ GLOSSMAP[String(g.word).toLowerCase()]=i; });
function bare(w){ return w.toLowerCase().replace(/^[^a-z0-9']+|[^a-z0-9']+$/g,""); }
var SENT=[];   /* {p, text, words[], starts[] (char offsets)} */
PAGES.forEach(function(pg,pi){
  (pg.sentences||[]).forEach(function(t){
    var text=String(t).trim(), words=text.split(/\s+/).filter(Boolean), starts=[], pos=0;
    words.forEach(function(w){ var at=text.indexOf(w,pos); starts.push(at<0?pos:at); pos=(at<0?pos:at)+w.length; });
    SENT.push({p:pi,text:text,words:words,starts:starts});
  });
});
var NSENT=SENT.length;
function renderStory(withEnd){
  var h="", si=0;
  PAGES.forEach(function(pg,pi){
    h+='<section class="bpage" data-p="'+pi+'">';
    if(pg.heading) h+='<h2 class="ph">'+esc(pg.heading)+'</h2>';
    h+='<p class="story">';
    (pg.sentences||[]).forEach(function(){
      var S=SENT[si];
      h+='<span class="s" data-s="'+si+'" role="button" tabindex="0" aria-label="'+esc(S.text)+'">';
      S.words.forEach(function(w,wi){
        var g=GLOSSMAP[bare(w)], inner=esc(w);
        if(g!==undefined){ var m=w.match(/^([^A-Za-z0-9']*)(.*?)([^A-Za-z0-9']*)$/); inner=esc(m[1])+'<u class="glu">'+esc(m[2])+'</u>'+esc(m[3]); }
        h+=(wi?" ":"")+'<span class="w'+(g!==undefined?' gl':'')+'" data-w="'+wi+'"'+(g!==undefined?' data-g="'+g+'"':'')+'>'+inner+'</span>';
      });
      h+='</span> ';
      si++;
    });
    h+='</p></section>';
  });
  if(withEnd){
    h+='<div class="endnote"><b>'+esc(L.endTitle)+'</b><p>'+esc(L.endText)+'</p>'+
       '<button type="button" class="btn" id="finishpass">'+esc(L.finishPass)+'</button></div>';
  }
  return h;
}

/* =============== the audio engine (three layers) =============== */
var A = {layer:null, playing:false, cur:-1, curW:-1, stopAfter:null, timer:null, ticker:null, utter:null, audio:null, timings:null, voice:null, seq:0};
var FORCE = QS.get("audio");            /* ?audio=timer|speech|recorded — test/teacher hook */
var WPM = +(QS.get("wpm")) || M.reading.wpm || 110;   /* ?wpm= — test hook only */
var synth = window.speechSynthesis || null;
function voices(){ try{ return synth?synth.getVoices():[]; }catch(e){ return []; } }
function pickVoice(){
  var vs=voices(), want=((M.audio&&M.audio.voice&&M.audio.voice.lang)||"en-GB").toLowerCase();
  var best=null;
  vs.forEach(function(v){ var l=(v.lang||"").toLowerCase().replace("_","-");
    if(!best && l===want) best=v; });
  if(!best) vs.forEach(function(v){ var l=(v.lang||"").toLowerCase(); if(!best && l.indexOf(want.slice(0,2))===0) best=v; });
  return best||vs[0]||null;
}
if(synth && synth.addEventListener){ synth.addEventListener("voiceschanged",function(){ A.voice=pickVoice(); paintTeacher(); }); }
function decideLayer(){
  if(FORCE==="timer") return "timer";
  if(A.timings && A.timings.length && A.audio && FORCE!=="speech") return "recorded";
  if(FORCE==="recorded") return "timer";
  if(synth && voices().length){ A.voice=A.voice||pickVoice(); return "speech"; }
  return "timer";
}
/* recorded layer setup */
function resolveAudio(p){ if(!p) return ""; if(/^(https?:)?\/\//.test(p)||p[0]==="/") return p; return ((M.audio&&M.audio.base)||"")+p; }
(function setupRecorded(){
  if(!M.audio||!M.audio.story||!M.audio.timings) return;
  var au=new Audio(); au.preload="auto"; au.src=resolveAudio(M.audio.story);
  fetch(resolveAudio(M.audio.timings)).then(function(r){ return r.ok?r.json():[]; }).then(function(j){
    if(Array.isArray(j)&&j.length){ A.timings=j.slice().sort(function(a,b){return a.s-b.s;}); A.audio=au;
      au.addEventListener("ended",function(){ if(A.layer==="recorded") finished(); });
    }
    paintTeacher();
  }).catch(function(){ paintTeacher(); });
})();

function layerName(){ var l=A.layer||decideLayer(); return l==="recorded"?L.layerRecorded:(l==="speech"?L.layerSpeech:L.layerTimer); }
function wordMs(w){ var base=60000/WPM/state.speed; var f=0.55+0.09*Math.min(w.length,12); return base*f; }
function clearTimers(){ if(A.timer){clearTimeout(A.timer);A.timer=null;} if(A.ticker){clearTimeout(A.ticker);A.ticker=null;} }

function highlight(si,wi){
  if(si!==A.cur){
    document.querySelectorAll(".s.cur-s").forEach(function(n){ n.classList.remove("cur-s"); });
    document.querySelectorAll('[data-s="'+si+'"]').forEach(function(n){ n.classList.add("cur-s"); });
    A.cur=si; A.curW=-1;
    if(SENT[si]) el("live").textContent=SENT[si].text;
  }
  if(wi!==A.curW){
    document.querySelectorAll(".w.cur-w").forEach(function(n){ n.classList.remove("cur-w"); });
    if(wi>=0) document.querySelectorAll('[data-s="'+si+'"] [data-w="'+wi+'"]').forEach(function(n){ n.classList.add("cur-w"); });
    A.curW=wi;
  }
  keepVisible(si,wi);
}
function clearHighlight(){
  document.querySelectorAll(".s.cur-s,.w.cur-w").forEach(function(n){ n.classList.remove("cur-s","cur-w"); });
  A.cur=-1; A.curW=-1;
}
function keepVisible(si,wi){
  if(bookOpen()){
    var t=flow.querySelector('[data-s="'+si+'"]'+(wi>=0?' [data-w="'+wi+'"]':''));
    if(t){ var p=pageOf(t); if(p!==page) go(p); }
  }
  if(leafOpen()){
    var s=el("ltext").querySelector('[data-s="'+si+'"]');
    if(s){ try{ s.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"}); }catch(e){ s.scrollIntoView(); } }
  }
}
function setNow(txt){ el("pnow").innerHTML=txt; }
function paintPlay(){
  var b=el("pplay"); b.textContent=(A.playing?"⏸ ":"▶ ")+(A.playing?L.pause:L.play); b.setAttribute("aria-pressed",A.playing?"true":"false");
}

/* play from sentence `from`; if single, stop after that sentence */
function play(from,single){
  stop(false);
  if(!NSENT) return;
  from=clamp(from|0,0,NSENT-1);
  A.layer=decideLayer(); A.playing=true; A.stopAfter=single?from:null; A.seq++;
  paintPlay(); paintTeacher();
  setNow("<b>"+esc(L.nowPlaying)+"</b>"+(A.layer==="timer"?" · "+esc(L.nowSilent):""));
  if(A.layer==="recorded") playRecorded(from);
  else if(A.layer==="speech") speakSentence(from);
  else timerSentence(from);
}
function pause(){ stop(true); setNow(esc(L.nowPaused)); }
function stop(keepMark){
  var wasPlaying=A.playing;
  A.playing=false; A.seq++;
  clearTimers();
  if(synth){ try{ synth.cancel(); }catch(e){} }
  if(A.audio){ try{ A.audio.pause(); }catch(e){} }
  if(A.raf){ cancelAnimationFrame(A.raf); A.raf=null; }
  if(!keepMark) clearHighlight();
  if(wasPlaying) paintPlay();
}
function nextSentence(si){
  if(!A.playing) return;
  if(A.stopAfter!==null && si>=A.stopAfter){ endSingle(); return; }
  if(si+1>=NSENT){ finished(); return; }
  var seq=A.seq;
  A.timer=setTimeout(function(){ if(seq!==A.seq) return;
    if(A.layer==="speech") speakSentence(si+1); else timerSentence(si+1); }, 380/state.speed);
}
function endSingle(){ A.playing=false; clearTimers(); paintPlay(); setNow(esc(L.nowReady)); }
function finished(){
  A.playing=false; clearTimers(); paintPlay(); setNow(esc(L.nowReady));
  if(bookOpen() && curPass && (curPass.key!=="alone")) tickPass(curPass.key);
}
/* layer 3 — the silent timer */
function timerSentence(si){
  var S=SENT[si], wi=0, seq=A.seq;
  function tick(){
    if(seq!==A.seq) return;
    if(wi>=S.words.length){ highlight(si,-1); nextSentence(si); return; }
    highlight(si,wi); var ms=wordMs(S.words[wi]); wi++;
    A.ticker=setTimeout(tick,ms);
  }
  tick();
}
/* layer 2 — Web Speech, sentence by sentence; onboundary drives the word, a ticker
   covers voices that never send boundaries (some iPad/Android voices). */
function speakSentence(si){
  var S=SENT[si], seq=A.seq, sawBoundary=false, wi=0, u;
  highlight(si,0);
  try{
    u=new SpeechSynthesisUtterance(S.text);
    if(A.voice) u.voice=A.voice;
    u.lang=(A.voice&&A.voice.lang)||((M.audio&&M.audio.voice&&M.audio.voice.lang)||"en-GB");
    u.rate=state.speed*((M.audio&&M.audio.voice&&M.audio.voice.rate)||1);
    u.onboundary=function(ev){
      if(seq!==A.seq) return;
      if(ev.name&&ev.name!=="word") return;
      sawBoundary=true; if(A.ticker){clearTimeout(A.ticker);A.ticker=null;}
      var ci=ev.charIndex|0, w=0;
      for(var k=0;k<S.starts.length;k++){ if(S.starts[k]<=ci) w=k; else break; }
      highlight(si,w);
    };
    u.onend=function(){ if(seq!==A.seq) return; clearTimers(); highlight(si,-1); nextSentence(si); };
    u.onerror=function(ev){
      if(seq!==A.seq) return;
      if(ev&&ev.error==="interrupted") return;
      /* the voice failed — fall to the timer for the rest of the book */
      A.layer="timer"; clearTimers(); paintTeacher(); timerSentence(si);
    };
    A.utter=u;
    synth.speak(u);
    /* fallback ticker: estimate words until a boundary event proves the voice reports them */
    function tick(){
      if(seq!==A.seq||sawBoundary) return;
      if(wi<S.words.length){ highlight(si,wi); A.ticker=setTimeout(tick,wordMs(S.words[wi])); wi++; }
    }
    A.ticker=setTimeout(tick,120);
  }catch(e){ A.layer="timer"; timerSentence(si); }
}
/* layer 1 — recorded audio with timings [{i,w,s,e}] */
function playRecorded(si){
  var first=null, firstIdx=0; for(var k=0;k<A.timings.length;k++){ if(A.timings[k].i===si){ first=A.timings[k]; firstIdx=k; break; } }
  var au=A.audio, seq=A.seq, target=first?first.s:0, stopAt=Infinity; au.playbackRate=state.speed;
  if(A.stopAfter!==null){ stopAt=-1; A.timings.forEach(function(e){ if(e.i===A.stopAfter && e.e>stopAt) stopAt=e.e; }); if(stopAt<0) stopAt=Infinity; }
  highlight(si,0);
  /* a seek before the metadata is in is silently dropped by Chrome — wait for it */
  function start(){
    if(seq!==A.seq) return;
    try{ au.currentTime=target; }catch(e){}
    var pr=au.play(); if(pr&&pr.catch) pr.catch(function(){ if(seq!==A.seq) return; A.layer="timer"; paintTeacher(); timerSentence(si); });
    A.raf=requestAnimationFrame(frame);
  }
  if(au.readyState>=1) start(); else { au.addEventListener("loadedmetadata",start,{once:true}); try{ au.load(); }catch(e){} }
  var idx=firstIdx;
  function frame(){
    if(seq!==A.seq) return;
    if(au.seeking||Math.abs(au.currentTime-target)>2&&au.currentTime<target){ A.raf=requestAnimationFrame(frame); return; }
    var t=au.currentTime;
    while(idx<A.timings.length-1 && A.timings[idx+1].s<=t) idx++;
    while(idx>0 && A.timings[idx].s>t) idx--;
    var e=A.timings[idx];

var wrapEl=el("bookwrap"), flow=el("flow"), vp=el("viewport");

function layout(){
  var w=vp.clientWidth;

  flow.style.paddingLeft=""; flow.style.paddingRight="";
  var cs=getComputedStyle(flow);
  var padL=parseFloat(cs.paddingLeft)||0, padR=parseFloat(cs.paddingRight)||0;
  var inner=w-padL-padR;
  per = inner>=900 ? 2 : 1;
  GAP = per===2 ? clamp(inner*0.07,56,110) : 56;
  var COLMAX=COLEM*(parseFloat(cs.fontSize)||18);
  var maxInner = per===2 ? (COLMAX*2+GAP) : COLMAX;
  if(inner>maxInner){ var extra=(inner-maxInner)/2; padL+=extra; padR+=extra; inner=maxInner;
    flow.style.paddingLeft=padL+"px"; flow.style.paddingRight=padR+"px"; }
  colW = per===2 ? (inner-GAP)/2 : inner; PADL=padL;
  flow.style.width=w+"px"; flow.style.columnWidth=colW+"px"; flow.style.columnGap=GAP+"px";
  flow.style.transform="translateX(0px)";

}

/* gestures — touch, cursor, trackpad (as in the reference) */
var sx=null,sy=null,st=0,drag=false,pid=null;

el("lcheck").addEventListener("click",checkLeaf);
el("ldone").addEventListener("click",function(){ if(!progress()) return; state.modules[curMod.key]=true; save(); closeLeaf(); });
el("lclose").addEventListener("click",closeLeaf);
el("lbook").addEventListener("click",function(){ openBook("alone"); });
leafWrap.addEventListener("pointerdown",function(e){ if(e.target===leafWrap) closeLeaf(); });
el("tabText").addEventListener("click",function(){ leafEl.classList.add("show-text"); leafEl.classList.remove("show-ex"); this.classList.add("on"); el("tabEx").classList.remove("on"); });
el("tabEx").addEventListener("click",function(){ leafEl.classList.add("show-ex"); leafEl.classList.remove("show-text"); this.classList.add("on"); el("tabText").classList.remove("on"); });
wireStory(el("ltext"));

/* recording (say items) — MediaRecorder, no scoring */
var REC_OK=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
var rec=null, recBtn=null, recChunks=[], recStream=null, recTimer=null;
function stopRec(){ if(rec&&rec.state!=="inactive"){ try{ rec.stop(); }catch(e){} } if(recTimer){clearTimeout(recTimer);recTimer=null;} }
function toggleRec(btn,i){
  if(!REC_OK) return;
  if(rec&&rec.state==="recording"){ stopRec(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recStream=stream; recChunks=[]; recBtn=btn;
    rec=new MediaRecorder(stream);
    rec.ondataavailable=function(ev){ if(ev.data&&ev.data.size) recChunks.push(ev.data); };
    rec.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});
      btn.classList.remove("live"); btn.textContent="⏺ "+L.record;
      var blob=new Blob(recChunks,{type:rec.mimeType||"audio/webm"}), url=URL.createObjectURL(blob);
      var out=el("lex").querySelector('[data-recout="'+i+'"]'); out.innerHTML='<audio controls src="'+url+'"></audio>';
      card(i).classList.add("done"); items[i].resolved=true; items[i].right=true; progress();
    };
    rec.start(); btn.classList.add("live"); btn.textContent="■ "+L.stopRec;
    recTimer=setTimeout(stopRec,15000);
  }).catch(function(){ btn.disabled=true; btn.textContent=L.noMic; });
}

/* =============== the page =============== */
function paint(){
  var rail=el("rail"); rail.innerHTML=""; var n=0, total=PASSES.length+MODS.length;
  PASSES.forEach(function(p){ var i=document.createElement("i"); if(state.passes[p.key]){ i.className="on"; n++; } rail.appendChild(i); });
  MODS.forEach(function(m){ var i=document.createElement("i"); if(state.modules[m.key]){ i.className="on"; n++; } rail.appendChild(i);
    var sec=el("mod-"+m.key); if(sec) sec.classList.toggle("done",!!state.modules[m.key]); });
  PASSES.forEach(function(p){ var sec=el("pass-"+p.key); if(sec) sec.classList.toggle("done",!!state.passes[p.key]); });
  el("railtext").textContent=lbl("railText",{n:n,m:total});
  var next=PASSES.filter(function(p){return !state.passes[p.key];})[0];
  PASSES.forEach(function(p){ var li=document.querySelector('.rungs li[data-r="'+p.key+'"]'); if(!li) return;
    li.classList.toggle("ok",!!state.passes[p.key]); li.classList.toggle("on",!!next&&next.key===p.key); });
}
function paintTeacher(){
  var bar=el("reviewbar"); bar.hidden=!TEACHER; if(!TEACHER) return;
  el("rvtitle").textContent=L.teacherTitle; el("rvsub").textContent=lbl("teacherSub",{layer:layerName()});
  el("rvreset").textContent=L.reset;
}
el("rvreset").addEventListener("click",function(){ state={passes:{},modules:{},speed:state.speed}; save(); paint(); });

function buildPage(){
  el("eyebrow").textContent=M.meta.eyebrow||(M.meta.course+" · "+M.meta.unit);
  el("h1").textContent=M.meta.title; el("sub").textContent=M.meta.sub||"";
  el("deskTitle").textContent=L.deskTitle; el("deskIntro").innerHTML=L.deskIntro;
  el("slabTop").textContent=M.meta.eyebrow?M.meta.eyebrow.split("·").slice(0,2).join("·").trim():M.meta.course;
  el("slabTitle").textContent=M.meta.title; el("slabBottom").textContent=M.meta.unit||""; el("slabOpen").textContent=L.openBook;
  el("bandText").innerHTML=L.bandText;
  el("howtoTitle").textContent=L.howtoTitle;
  el("howtoBody").innerHTML=(Array.isArray(L.howto)?L.howto:[L.howto]).map(function(p){return "<p>"+p+"</p>";}).join("");
  var r=el("rungs"); r.innerHTML="";
  PASSES.forEach(function(p,i){ var li=document.createElement("li"); li.dataset.r=p.key;
    li.innerHTML='<button type="button" data-pass="'+esc(p.key)+'"><b>'+(i+1)+'</b><span>'+esc(p.title)+'</span></button>'; r.appendChild(li); });
  var h='<h3 class="stackhd">'+esc(L.passesHead)+'</h3><p class="stacksub">'+esc(L.passesSub)+'</p>';
  PASSES.forEach(function(p,i){
    h+='<section class="mod book" id="pass-'+esc(p.key)+'" style="--c:var(--ac)"><button class="mhead" data-pass="'+esc(p.key)+'"><span class="mnum">'+(i+1)+'</span>'+
       '<span class="mtitle"><b>'+esc(p.title)+'</b><span>'+esc(p.how||"")+'</span></span><span class="chev">'+esc(L.openTheBook)+'</span></button></section>';
  });
  h+='<h3 class="stackhd">'+esc(L.modulesHead)+'</h3><p class="stacksub">'+esc(L.modulesSub)+'</p>';
  MODS.forEach(function(m,i){
    var n=m.kind==="order"?(m.items||[]).length+" events":(m.items||[]).length+" tasks";
    h+='<section class="mod leaf-mod" id="mod-'+esc(m.key)+'" style="--c:'+(COLOURS[m.colour]||COLOURS.ac)+'"><button class="mhead" data-leaf="'+esc(m.key)+'"><span class="mnum">'+(PASSES.length+i+1)+'</span>'+
       '<span class="mtitle"><b>'+esc(m.title)+'</b><span>'+esc((KINDLBL[m.kind]||m.kind)+" · "+n)+'</span></span><span class="chev">'+esc(L.openTheLeaf)+'</span></button></section>';
  });
  el("stack").innerHTML=h;
  el("foot").innerHTML=esc(M.meta.course+" · "+M.meta.unit+" · "+M.meta.school)+"<br>"+esc(L.footer);
  el("bclose").textContent=L.closeBook; el("prestart").textContent="↺ "+L.restart;
  el("lbook").textContent=L.openBookShort; el("lclose").textContent=L.close;
  el("tabText").textContent=L.theStory; el("tabEx").textContent=L.theTasks;
  el("lcheck").textContent=L.check; el("ldone").textContent=L.finish;
  el("gsheetHd").textContent=L.wordHelp; el("gclose").textContent=L.close; el("ghear").textContent="🔊 "+L.hearIt;
  if(!REC_OK) document.documentElement.classList.add("norec");
  paintSpeed(); paintPlay();
}
if(!REC_OK){ var st=document.createElement("style"); st.textContent=".norec [data-rec]{display:none}"; document.head.appendChild(st); }
document.addEventListener("click",function(e){
  var bk=e.target.closest("[data-pass]"); if(bk){ openBook(bk.dataset.pass); return; }
  var lf=e.target.closest("[data-leaf]"); if(lf){ openLeaf(lf.dataset.leaf); return; }
});
el("bookobj").addEventListener("click",function(){
  var next=PASSES.filter(function(p){return !state.passes[p.key];})[0]||PASSES[PASSES.length-1]; openBook(next?next.key:"alone");
});
buildPage(); paint(); paintTeacher();
window.__chapter={state:function(){return state;},audio:A,sentences:SENT,layer:function(){return A.layer||decideLayer();}};
})();
